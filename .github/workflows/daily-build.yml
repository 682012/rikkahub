name: RikkaHub Daily Build (4C16G)

# Installed on the default branch (master). The SOURCE below is fork/3.1.0.
on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rikkahub-nightly-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
    steps:
      - name: Checkout build source
        uses: actions/checkout@v4
        with:
          ref: fork/3.1.0
          fetch-depth: 1
          persist-credentials: false
      - name: Check whether a build is necessary
        id: decision
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled builds only run if the selected source branch was recently updated.
          latest=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ "$((now-latest))" -lt 86400 ]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
            echo 'No new source commit in the past 24h; skipping.'
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Only the release job can update the existing nightly prerelease.
    steps:
      - name: Checkout fork 3.1.0 including submodules
        uses: actions/checkout@v4
        with:
          ref: fork/3.1.0
          submodules: recursive
          persist-credentials: false

      - name: Runner resources and disk safety
        shell: bash
        run: |
          echo "CPU: $(nproc)"
          free -h
          df -h /
          available=$(df -Pk / | awk 'END {print $4}')
          if [ "$available" -lt 8388608 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          fi
          df -h /
          available=$(df -Pk / | awk 'END {print $4}')
          if [ "$available" -lt 6291456 ]; then
            echo '::error::Not enough free disk space for Android build (<6 GiB)'
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Android SDK 37.2 + Build Tools 37.0.0
        shell: bash
        run: |
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkm" ]; then
            sdkm="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$sdkm" ] || [ ! -x "$sdkm" ]; then
            echo '::error::Android sdkmanager not found'
            exit 1
          fi
          yes | "$sdkm" --licenses >/dev/null || true
          "$sdkm" --channel=3 --install 'platforms;android-37.2' 'build-tools;37.0.0'
          df -h /

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Limit Gradle and Kotlin memory
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'GRADLE'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx3072m
          org.gradle.workers.max=2
          org.gradle.parallel=false
          GRADLE

      - name: Prepare signing and Google Services from GitHub Secrets
        shell: bash
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for key in KEY_BASE64 SIGNING_CONFIG GOOGLE_SERVICES_JSON; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required GitHub Secret $key is missing"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 -m json.tool app/google-services.json >/dev/null
          test -s app/app.key

      - name: Build SIGNED release APK (R8 enabled)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain
          echo 'Build output:'
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -printf '%f %s bytes\n'
          free -h
          df -h /

      - name: Publish/update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: fork/3.1.0
          name: Nightly Build
          prerelease: true
          generate_release_notes: false
          body: |
            RikkaHub fork/3.1.0 nightly build.
            Workflow: GitHub-hosted Ubuntu 4 vCPU / 16 GB runner.
            For testing only; inspect changes before installing.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
